<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 150" width="840" height="150" role="img" aria-label="The six states of Attention Buddy: working, needs you, done, seen, error and asleep">
  <title>Attention Buddy states (mascot artwork © Anthropic, see NOTICE)</title>
  <defs>
    <style>
      text { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8a8f98; text-anchor: middle; }
      .note { font-weight: 400; font-size: 12px; }
      .part, .fig, .whole, .arm-l, .arm-r, .legs-a, .legs-b, .eyes { transform-box: view-box; }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
      @keyframes step-a { 0%, 49% { transform: translateY(0) } 50%, 100% { transform: translateY(-1px) } }
      @keyframes step-b { 0%, 49% { transform: translateY(-1px) } 50%, 100% { transform: translateY(0) } }
      @keyframes jump { 0%, 100% { transform: translateY(0) scaleY(1) } 6% { transform: translateY(0) scaleY(.82) } 16% { transform: translateY(-4px) scaleY(1.08) } 26% { transform: translateY(0) scaleY(.88) } 32% { transform: translateY(0) scaleY(1) } }
      @keyframes wave { 0%, 10% { transform: rotate(0) } 20% { transform: rotate(-115deg) } 30% { transform: rotate(-65deg) } 40% { transform: rotate(-115deg) } 50% { transform: rotate(-65deg) } 60% { transform: rotate(-115deg) } 72%, 100% { transform: rotate(0) } }
      @keyframes hop { 0%, 100% { transform: translateY(0) } 8% { transform: translateY(0) scaleY(.88) } 18% { transform: translateY(-3px) } 28% { transform: translateY(0) } }
      @keyframes tada-l { 0%, 8%, 55%, 100% { transform: rotate(0) } 18%, 45% { transform: rotate(80deg) } }
      @keyframes tada-r { 0%, 8%, 55%, 100% { transform: rotate(0) } 18%, 45% { transform: rotate(-80deg) } }
      @keyframes shake { 0%, 40%, 100% { transform: translateX(0) } 5%, 15%, 25% { transform: translateX(-1.2px) } 10%, 20%, 30% { transform: translateX(1.2px) } }
      @keyframes blink { 0%, 90%, 100% { transform: scaleY(1) } 94% { transform: scaleY(.1) } }
      .whole { transform-origin: 12px 20px; }
      .arm-l { transform-origin: 3px 12.5px; }
      .arm-r { transform-origin: 21px 12.5px; }
      .eyes rect { transform-box: fill-box; transform-origin: center; }
      .working .legs-a { animation: step-a .8s infinite; }
      .working .legs-b { animation: step-b .8s infinite; }
      .working .eyes rect, .done .eyes rect, .seen .eyes rect { animation: blink 4s infinite; }
      .needs .fig { animation: pulse 1s ease-in-out infinite; }
      .needs .whole { animation: jump 3s ease-in-out infinite; }
      .needs .arm-r { animation: wave 3s ease-in-out infinite; }
      .done .whole { animation: hop 4s ease-in-out infinite; }
      .done .arm-l { animation: tada-l 4s ease-in-out infinite; }
      .done .arm-r { animation: tada-r 4s ease-in-out infinite; }
      .error .whole { animation: shake 2.5s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { transform: scaleY(1) } 50% { transform: scaleY(.95) } }
      @keyframes float-z { 0% { opacity: 0; transform: translate(0, 0) scale(.6) } 40% { opacity: 1 } 100% { opacity: 0; transform: translate(5px, -14px) scale(1.1) } }
      .asleep .whole { animation: breathe 3.6s ease-in-out infinite; }
      text.z { font-weight: 700; font-size: 14px; fill: #8E8E93; text-anchor: start; transform-box: fill-box; transform-origin: center; opacity: 0; animation: float-z 3s ease-in-out infinite; }
      text.z.later { animation-delay: 1.5s; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } text.z { opacity: 1; } text.z.later { opacity: 0; } }
    </style>
  </defs>

  <g class="working" transform="translate(30 6) scale(3.2)"><g class="fig" fill="#D97757" opacity=".55">
      <g class="whole">
        <mask id="eyes-working" maskUnits="userSpaceOnUse" x="-2" y="-6" width="30" height="30">
          <rect x="-2" y="-6" width="30" height="30" fill="#fff"/>
          <g class="eyes"><rect x="6" y="8.102" width="1.488" height="2.847" fill="#000"/><rect x="16.51" y="8.102" width="1.49" height="2.847" fill="#000"/></g>
        </mask>
        <rect x="3" y="5" width="18" height="12.079" mask="url(#eyes-working)"/>
        <g class="arm-l"><rect x="0" y="10.95" width="3.1" height="3.1"/></g>
        <g class="arm-r"><rect x="20.9" y="10.949" width="3.1" height="3.102"/></g>
        <g class="legs-a"><rect x="4.487" y="17" width="1.513" height="3"/><rect x="15" y="17" width="1.513" height="3"/></g>
        <g class="legs-b"><rect x="7.488" y="17" width="1.512" height="3"/><rect x="18" y="17" width="1.513" height="3"/></g>
      </g>
  </g></g>
  <g class="needs" transform="translate(170 6) scale(3.2)"><g class="fig" fill="#E5484D">
      <g class="whole">
        <mask id="eyes-needs" maskUnits="userSpaceOnUse" x="-2" y="-6" width="30" height="30">
          <rect x="-2" y="-6" width="30" height="30" fill="#fff"/>
          <g class="eyes"><rect x="6" y="8.102" width="1.488" height="2.847" fill="#000"/><rect x="16.51" y="8.102" width="1.49" height="2.847" fill="#000"/></g>
        </mask>
        <rect x="3" y="5" width="18" height="12.079" mask="url(#eyes-needs)"/>
        <g class="arm-l"><rect x="0" y="10.95" width="3.1" height="3.1"/></g>
        <g class="arm-r"><rect x="20.9" y="10.949" width="3.1" height="3.102"/></g>
        <g class="legs-a"><rect x="4.487" y="17" width="1.513" height="3"/><rect x="15" y="17" width="1.513" height="3"/></g>
        <g class="legs-b"><rect x="7.488" y="17" width="1.512" height="3"/><rect x="18" y="17" width="1.513" height="3"/></g>
      </g>
  </g></g>
  <g class="done" transform="translate(310 6) scale(3.2)"><g class="fig" fill="#46A758">
      <g class="whole">
        <mask id="eyes-done" maskUnits="userSpaceOnUse" x="-2" y="-6" width="30" height="30">
          <rect x="-2" y="-6" width="30" height="30" fill="#fff"/>
          <g class="eyes"><rect x="6" y="8.102" width="1.488" height="2.847" fill="#000"/><rect x="16.51" y="8.102" width="1.49" height="2.847" fill="#000"/></g>
        </mask>
        <rect x="3" y="5" width="18" height="12.079" mask="url(#eyes-done)"/>
        <g class="arm-l"><rect x="0" y="10.95" width="3.1" height="3.1"/></g>
        <g class="arm-r"><rect x="20.9" y="10.949" width="3.1" height="3.102"/></g>
        <g class="legs-a"><rect x="4.487" y="17" width="1.513" height="3"/><rect x="15" y="17" width="1.513" height="3"/></g>
        <g class="legs-b"><rect x="7.488" y="17" width="1.512" height="3"/><rect x="18" y="17" width="1.513" height="3"/></g>
      </g>
  </g></g>
  <g class="seen" transform="translate(450 6) scale(3.2)"><g class="fig" fill="#E5484D">
      <g class="whole">
        <mask id="eyes-seen" maskUnits="userSpaceOnUse" x="-2" y="-6" width="30" height="30">
          <rect x="-2" y="-6" width="30" height="30" fill="#fff"/>
          <g class="eyes"><rect x="6" y="8.102" width="1.488" height="2.847" fill="#000"/><rect x="16.51" y="8.102" width="1.49" height="2.847" fill="#000"/></g>
        </mask>
        <rect x="3" y="5" width="18" height="12.079" mask="url(#eyes-seen)"/>
        <g class="arm-l"><rect x="0" y="10.95" width="3.1" height="3.1"/></g>
        <g class="arm-r"><rect x="20.9" y="10.949" width="3.1" height="3.102"/></g>
        <g class="legs-a"><rect x="4.487" y="17" width="1.513" height="3"/><rect x="15" y="17" width="1.513" height="3"/></g>
        <g class="legs-b"><rect x="7.488" y="17" width="1.512" height="3"/><rect x="18" y="17" width="1.513" height="3"/></g>
      </g>
  </g></g>
  <g class="error" transform="translate(590 6) scale(3.2)"><g class="fig" fill="#E5484D">
      <g class="whole">
        <mask id="eyes-error" maskUnits="userSpaceOnUse" x="-2" y="-6" width="30" height="30">
          <rect x="-2" y="-6" width="30" height="30" fill="#fff"/>
          <g class="eyes"><rect x="6" y="8.102" width="1.488" height="2.847" fill="#000"/><rect x="16.51" y="8.102" width="1.49" height="2.847" fill="#000"/></g>
        </mask>
        <rect x="3" y="5" width="18" height="12.079" mask="url(#eyes-error)"/>
        <g class="arm-l"><rect x="0" y="10.95" width="3.1" height="3.1"/></g>
        <g class="arm-r"><rect x="20.9" y="10.949" width="3.1" height="3.102"/></g>
        <g class="legs-a"><rect x="4.487" y="17" width="1.513" height="3"/><rect x="15" y="17" width="1.513" height="3"/></g>
        <g class="legs-b"><rect x="7.488" y="17" width="1.512" height="3"/><rect x="18" y="17" width="1.513" height="3"/></g>
      </g>
  </g></g>

  <g class="asleep" transform="translate(730 6) scale(3.2)"><g class="fig" fill="#8E8E93">
      <g class="whole">
        <mask id="eyes-asleep" maskUnits="userSpaceOnUse" x="-2" y="-6" width="30" height="30">
          <rect x="-2" y="-6" width="30" height="30" fill="#fff"/>
          <g><rect x="6" y="10.494" width="1.488" height="0.455" fill="#000"/><rect x="16.51" y="10.494" width="1.49" height="0.455" fill="#000"/></g>
        </mask>
        <rect x="3" y="5" width="18" height="12.079" mask="url(#eyes-asleep)"/>
        <rect x="0" y="10.95" width="3.1" height="3.1" transform="rotate(-72 3 12.5)"/>
        <rect x="20.9" y="10.949" width="3.1" height="3.102" transform="rotate(72 21 12.5)"/>
        <rect x="4.487" y="17" width="1.513" height="3"/><rect x="15" y="17" width="1.513" height="3"/>
        <rect x="7.488" y="17" width="1.512" height="3"/><rect x="18" y="17" width="1.513" height="3"/>
      </g>
  </g></g>
  <text class="z" x="792" y="24">z</text><text class="z later" x="792" y="24">z</text>

  <text x="70" y="118">Working</text><text class="note" x="70" y="138">steps in place</text>
  <text x="210" y="118">Needs you</text><text class="note" x="210" y="138">blinks, jumps, waves</text>
  <text x="350" y="118">Done</text><text class="note" x="350" y="138">one happy hop</text>
  <text x="490" y="118">Seen</text><text class="note" x="490" y="138">you looked; waits</text>
  <text x="630" y="118">Error</text><text class="note" x="630" y="138">shakes its head</text>
  <text x="770" y="118">Asleep</text><text class="note" x="770" y="138">quiet for a while</text>
</svg>
