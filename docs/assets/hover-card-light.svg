<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 364" width="700" height="364" role="img" aria-label="Session card of Attention Buddy: two sessions need you, one is done, one works in a terminal; the first row is highlighted under the pointer">
  <title>Attention Buddy session card (example sessions; mascot artwork © Anthropic, see NOTICE)</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }
      @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
      .icon, .dot-needs { animation: pulse 1s ease-in-out infinite; }
      .dot-working { animation: breathe 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .icon, .dot-needs, .dot-working { animation: none; } }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.18"/></filter>
  </defs>
  <g class="icon" transform="translate(314.0 28) scale(3)"><path fill="#E5484D" fill-rule="evenodd" d="M20.998 10.949H24v3.102h-3v3.028h-1.487V20H18v-2.921h-1.487V20H15v-2.921H9V20H7.488v-2.921H6V20H4.487v-2.921H3V14.05H0V10.95h3V5h17.998v5.949zM6 10.949h1.488V8.102H6v2.847zm10.51 0H18V8.102h-1.49v2.847z"/></g>
  <rect x="185.0" y="96" width="330" height="244" rx="10" fill="#FFFFFF" stroke="#E3E3E6" filter="url(#shadow)"/>
  <text x="199.0" y="121" font-size="12" font-weight="600" fill="#6E6E73">2 sessions need you</text>
  <rect x="191.0" y="130" width="318" height="40" rx="6" fill="#1D1D1F" fill-opacity="0.07"/>
  <circle cx="203.0" cy="144" r="4" fill="#E5484D" class="dot-needs"/>
  <text x="215.0" y="148" font-size="14" font-weight="500" fill="#1D1D1F">Refactor payment module</text>
  <text x="215.0" y="164" font-size="12" fill="#6E6E73">Needs your approval for Bash</text>
  <text x="493.0" y="156" font-size="17" fill="#A1A1A6">›</text>
  <circle cx="203.0" cy="188" r="4" fill="#E5484D" class="dot-needs"/>
  <text x="215.0" y="192" font-size="14" font-weight="500" fill="#1D1D1F">Write release notes</text>
  <text x="215.0" y="208" font-size="12" fill="#6E6E73">Has a question for you</text>
  <text x="493.0" y="200" font-size="17" fill="#A1A1A6">›</text>
  <circle cx="203.0" cy="232" r="4" fill="#46A758"/>
  <text x="215.0" y="236" font-size="14" font-weight="500" fill="#1D1D1F">Fix flaky login test</text>
  <text x="215.0" y="252" font-size="12" fill="#6E6E73">Done</text>
  <text x="493.0" y="244" font-size="17" fill="#A1A1A6">›</text>
  <circle cx="203.0" cy="276" r="4" fill="#D97757" class="dot-working"/>
  <text x="215.0" y="280" font-size="14" font-weight="500" fill="#6E6E73">Migrate to Swift 6</text>
  <text x="215.0" y="296" font-size="12" fill="#6E6E73">Working · in a terminal</text>
  <text x="199.0" y="324" font-size="11" fill="#A1A1A6">Click a session to open it</text>
</svg>
